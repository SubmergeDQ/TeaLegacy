<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="棉纸包裹的普洱茶砖">
  <defs>
    <radialGradient id="brickWash" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#6B4226" stop-opacity="0" />
      <stop offset="100%" stop-color="#6B4226" stop-opacity="0.13" />
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#brickWash)" />
  <ellipse cx="150" cy="248" rx="88" ry="8" fill="#2F4F4F" opacity="0.08" />

  <!-- 砖身：正面、顶面、侧面 -->
  <path d="M60 160 L 96 128 L 252 128 L 216 160 Z" fill="#F0E4C9" stroke="#2F4F4F" stroke-width="2.8" stroke-linejoin="round" />
  <path d="M216 160 L 252 128 L 252 214 L 216 246 Z" fill="#E7D9B9" stroke="#2F4F4F" stroke-width="2.8" stroke-linejoin="round" />
  <rect x="60" y="160" width="156" height="86" rx="2" fill="#F0E4C9" stroke="#2F4F4F" stroke-width="2.8" />

  <!-- 棉纸折边 -->
  <g stroke="#2F4F4F" stroke-width="1.2" fill="none" opacity="0.3" stroke-linecap="round">
    <path d="M76 174 H200" />
    <path d="M76 232 H200" />
    <path d="M72 160 V 246" />
    <path d="M204 160 V 246" />
    <path d="M96 128 L 80 144" />
    <path d="M252 128 L 236 144" />
  </g>

  <!-- 纸纤维 -->
  <g stroke="#2F4F4F" stroke-width="1" fill="none" opacity="0.12" stroke-linecap="round">
    <path d="M92 196 q30 10 58 6" />
    <path d="M170 216 q18 -6 30 -16" />
    <path d="M86 216 q20 8 40 6" />
  </g>

  <!-- 捆扎的棉线 -->
  <g stroke="#6B4226" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M108 128 V 246" />
    <path d="M192 128 V 246" />
    <path d="M108 188 q42 -6 84 0" />
  </g>

  <!-- 落款 -->
  <g transform="rotate(-4 150 208)">
    <rect x="126" y="184" width="48" height="48" rx="4" fill="#FCFAF5" fill-opacity="0.55" stroke="#6B4226" stroke-width="2" />
    <text x="150" y="219" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-size="26" fill="#6B4226">承</text>
  </g>

  <!-- 茶签 -->
  <g transform="rotate(-6 232 96)">
    <rect x="216" y="76" width="32" height="44" rx="2" fill="#FCFAF5" stroke="#2F4F4F" stroke-width="1.4" />
    <path d="M232 76 v -12" fill="none" stroke="#2F4F4F" stroke-width="1.2" />
    <text x="232" y="94" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-size="14" fill="#6B4226">砖</text>
    <text x="232" y="111" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-size="14" fill="#6B4226">茶</text>
  </g>

  <path d="M38 250 Q150 262 262 250" fill="none" stroke="#2F4F4F" stroke-width="1.2" opacity="0.22" />
</svg>
