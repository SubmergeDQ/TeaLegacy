<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="竹匾里排开的普洱龙珠">
  <defs>
    <radialGradient id="beadWash" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#6B4226" stop-opacity="0" />
      <stop offset="100%" stop-color="#6B4226" stop-opacity="0.13" />
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#beadWash)" />
  <ellipse cx="150" cy="250" rx="82" ry="8" fill="#2F4F4F" opacity="0.08" />

  <!-- 竹匾 -->
  <ellipse cx="150" cy="218" rx="100" ry="30" fill="#F3ECDC" stroke="#2F4F4F" stroke-width="2.4" />
  <ellipse cx="150" cy="218" rx="88" ry="23" fill="none" stroke="#2F4F4F" stroke-width="1.1" opacity="0.3" />
  <g stroke="#2F4F4F" stroke-width="1" opacity="0.16">
    <path d="M54 208 H246" />
    <path d="M60 226 H240" />
  </g>

  <!-- 茶珠：七颗围成一圈，一颗在中间 -->
  <g stroke="#2F4F4F" stroke-width="2.2">
    <g fill="#7A4A28">
      <circle cx="150" cy="196" r="23" />
      <circle cx="108" cy="176" r="19" />
      <circle cx="150" cy="160" r="19" />
      <circle cx="192" cy="176" r="19" />
      <circle cx="106" cy="212" r="18" />
      <circle cx="194" cy="212" r="18" />
      <circle cx="150" cy="228" r="18" />
      <circle cx="124" cy="202" r="15" opacity="0.92" />
      <circle cx="176" cy="202" r="15" opacity="0.92" />
    </g>
  </g>
  <g stroke="#3D2412" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M140 190 q10 -6 20 0" />
    <path d="M139 201 q11 5 22 0" />
    <path d="M100 171 q8 -5 16 0" />
    <path d="M184 171 q8 -5 16 0" />
    <path d="M142 160 q8 -4 16 0" />
    <path d="M98 208 q8 -4 16 0" />
    <path d="M186 208 q8 -4 16 0" />
  </g>

  <!-- 散落的条索 -->
  <g stroke="#6B4226" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M62 238 q14 -6 28 -2" />
    <path d="M216 242 q12 -8 24 -6" />
    <path d="M240 190 q10 2 16 10" />
  </g>

  <!-- 茶签 -->
  <g transform="rotate(-5 226 98)">
    <rect x="208" y="76" width="36" height="48" rx="2" fill="#FCFAF5" stroke="#2F4F4F" stroke-width="1.4" />
    <path d="M226 76 v -12" fill="none" stroke="#2F4F4F" stroke-width="1.2" />
    <text x="226" y="96" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-size="15" fill="#6B4226">龙</text>
    <text x="226" y="114" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-size="15" fill="#6B4226">珠</text>
  </g>

  <g transform="rotate(-6 72 112)">
    <rect x="56" y="96" width="32" height="32" rx="3" fill="none" stroke="#6B4226" stroke-width="1.8" />
    <text x="72" y="120" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif" font-size="18" fill="#6B4226">承</text>
  </g>

  <path d="M40 252 Q150 264 260 252" fill="none" stroke="#2F4F4F" stroke-width="1.2" opacity="0.22" />
</svg>
