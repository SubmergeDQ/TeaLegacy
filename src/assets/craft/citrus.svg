<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="填茶生晒的小青柑">
  <defs>
    <radialGradient id="ganWash" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#6B4226" stop-opacity="0" />
      <stop offset="100%" stop-color="#6B4226" stop-opacity="0.13" />
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#ganWash)" />
  <ellipse cx="150" cy="238" rx="70" ry="8" fill="#2F4F4F" opacity="0.08" />

  <!-- 柑身 -->
  <circle cx="150" cy="160" r="64" fill="#E2E7CB" stroke="#2F4F4F" stroke-width="3" />

  <!-- 油胞：细点，果皮的毛孔 -->
  <g fill="#2F4F4F" opacity="0.16">
    <circle cx="118" cy="176" r="2" />
    <circle cx="134" cy="196" r="2.2" />
    <circle cx="160" cy="204" r="2" />
    <circle cx="180" cy="186" r="2.2" />
    <circle cx="192" cy="164" r="2" />
    <circle cx="112" cy="150" r="2" />
    <circle cx="172" cy="152" r="1.8" />
    <circle cx="146" cy="182" r="1.8" />
  </g>

  <!-- 切口与填入的茶 -->
  <ellipse cx="150" cy="120" rx="42" ry="13" fill="#EDE9D5" stroke="#2F4F4F" stroke-width="1.8" />
  <ellipse cx="150" cy="120" rx="27" ry="7.5" fill="#7A4A28" opacity="0.85" />
  <g fill="#6B4226" opacity="0.5">
    <circle cx="140" cy="119" r="1.6" />
    <circle cx="152" cy="121" r="1.8" />
    <circle cx="160" cy="118" r="1.5" />
  </g>

  <!-- 果柄与叶 -->
  <path d="M150 108 q0 -10 0 -16" fill="none" stroke="#2F4F4F" stroke-width="1.6" stroke-linecap="round" />
  <path
    d="M152 96 q20 -22 42 -24 q-6 24 -42 24 z"
    fill="#DEE4CB"
    stroke="#2F4F4F"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <!-- 茶席 -->
  <path d="M52 240 Q150 252 248 240" fill="none" stroke="#2F4F4F" stroke-width="1.2" opacity="0.22" />
</svg>
