<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="棉纸包裹的生茶饼">
  <defs>
    <radialGradient id="cakeWash" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#6B4226" stop-opacity="0" />
      <stop offset="100%" stop-color="#6B4226" stop-opacity="0.13" />
    </radialGradient>
  </defs>

  <circle cx="150" cy="150" r="130" fill="url(#cakeWash)" />
  <ellipse cx="150" cy="250" rx="78" ry="8" fill="#2F4F4F" opacity="0.08" />

  <!-- 饼身：棉纸包 -->
  <circle cx="150" cy="152" r="84" fill="#F0E4C9" stroke="#2F4F4F" stroke-width="3" />

  <!-- 棉纸折边：八道向内的短折 -->
  <g stroke="#2F4F4F" stroke-width="1.2" stroke-linecap="round" opacity="0.32">
    <path d="M234 152 L218 152" />
    <path d="M209.4 211.4 L198.1 200.1" />
    <path d="M150 236 L150 220" />
    <path d="M90.6 211.4 L101.9 200.1" />
    <path d="M66 152 L82 152" />
    <path d="M90.6 92.6 L101.9 103.9" />
    <path d="M150 68 L150 84" />
    <path d="M209.4 92.6 L198.1 103.9" />
  </g>

  <!-- 纸纤维 -->
  <g stroke="#2F4F4F" stroke-width="1" fill="none" opacity="0.13" stroke-linecap="round">
    <path d="M96 196 q28 12 56 8" />
    <path d="M168 214 q22 -6 38 -18" />
    <path d="M92 128 q16 -10 32 -12" />
    <path d="M182 96 q18 8 26 22" />
  </g>

  <!-- 落款：茶承印 -->
  <g transform="rotate(-6 150 152)">
    <rect x="126" y="128" width="48" height="48" rx="4" fill="none" stroke="#6B4226" stroke-width="2" />
    <text
      x="150"
      y="164"
      text-anchor="middle"
      font-family="'Noto Serif SC', 'Songti SC', 'SimSun', serif"
      font-size="26"
      fill="#6B4226"
    >承</text>
  </g>

  <!-- 茶席 -->
  <path d="M46 250 Q150 262 254 250" fill="none" stroke="#2F4F4F" stroke-width="1.2" opacity="0.22" />
</svg>
